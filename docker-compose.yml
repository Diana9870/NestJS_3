# MongoDB for local development: `docker compose up -d`.
# The port can be changed with MONGO_PORT in .env (default 27017).
services:
  mongo:
    image: mongo:7
    container_name: cinema-mongo
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - cinema_mongodata:/data/db
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  cinema_mongodata:
